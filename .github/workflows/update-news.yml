
name: Collect Tamil news for admin review

on:
  workflow_dispatch:
  schedule:
    - cron: "17,37 * * * *"

permissions:
  contents: write

jobs:
  collect-news:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Collect news for approval
        run: python scripts/update_news.py

      - name: Save pending news
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pending-news.json
          if git diff --cached --quiet; then
            echo "No new pending news"
          else
            git commit -m "Collect news for admin review"
            git push
          fi
